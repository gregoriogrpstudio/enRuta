<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EnRuta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #1c2521;
    --panel: #23302b;
    --panel-border: #35453d;
    --ink: #e8ece9;
    --ink-dim: #9fb0a7;
    --accent: #5fb488;
    --accent-dim: #3d7e5e;
    --warn: #d98a4f;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #map { flex: 1 1 auto; min-height: 0; }
  #panel {
    flex: 0 0 auto;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    padding: 12px 14px 16px;
    max-height: 48vh;
    overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; letter-spacing: 0.2px; }
  .step { margin-bottom: 12px; }
  .step-label { font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .step-label .n { color: var(--accent); font-weight: 600; margin-right: 4px; }
  input[type="file"] {
    width: 100%; font-size: 13px; color: var(--ink-dim);
  }
  button {
    background: var(--accent-dim); color: var(--ink); border: none; border-radius: var(--radius);
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button:disabled { background: #33403a; color: var(--ink-dim); cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--ink-dim); font-weight: 500; margin-top: 6px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .radius-value { color: var(--accent); font-weight: 700; }
  #status { font-size: 13px; color: var(--ink-dim); margin-top: 10px; line-height: 1.4; min-height: 18px; }
  #status.err { color: var(--warn); }
  .pill { display: inline-block; background: var(--panel-border); color: var(--ink-dim); font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-top: 4px; }
  .leaflet-popup-content { font-size: 13px; }

  /* Slider de rango con dos tiradores (A y B superpuestos sobre el mismo eje) */
  .range-slider { position: relative; height: 26px; margin-top: 10px; }
  .range-slider .track {
    position: absolute; top: 50%; left: 0; right: 0; height: 4px;
    background: var(--panel-border); border-radius: 2px; transform: translateY(-50%);
  }
  .range-slider .track-fill {
    position: absolute; top: 50%; height: 4px;
    background: var(--accent); border-radius: 2px; transform: translateY(-50%);
  }
  .range-slider input[type="range"] {
    position: absolute; top: 0; left: 0; width: 100%; height: 26px; margin: 0;
    background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none;
  }
  .range-slider input[type="range"]::-webkit-slider-runnable-track { background: transparent; }
  .range-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); cursor: pointer; margin-top: 0;
  }
  .range-slider input[type="range"]::-moz-range-track { background: transparent; border: none; }
  .range-slider input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <h1>EnRuta</h1>

    <div class="step">
      <div class="step-label"><span><span class="n">1.</span>Importar ruta (GPX)</span></div>
      <input type="file" id="gpxFile" accept=".gpx" />
    </div>

    <div class="step">
      <div class="step-label">
        <span><span class="n">2.</span>Tramo A → B</span>
        <span class="radius-value" id="abKmLabel">—</span>
      </div>
      <div id="abInstructions" class="pill">Carga una ruta primero</div>

      <div class="range-slider" id="abRangeWrap">
        <div class="track"></div>
        <div class="track-fill" id="abTrackFill"></div>
        <input type="range" id="sliderA" min="0" max="0" step="1" value="0" disabled />
        <input type="range" id="sliderB" min="0" max="0" step="1" value="0" disabled />
      </div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-dim); margin-top:2px;">
        <span id="aKmLabel">—</span>
        <span id="bKmLabel">—</span>
      </div>

      <button class="secondary" id="resetAB" style="display:none; margin-top:8px;">Usar ruta completa</button>
    </div>

    <div class="step">
      <div class="step-label">
        <span><span class="n">3.</span>Radio de búsqueda</span>
        <span class="radius-value" id="radiusLabel">120 m</span>
      </div>
      <input type="range" id="radiusSlider" min="50" max="500" step="10" value="120" />
    </div>

    <div class="step">
      <div class="step-label"><span><span class="n">4.</span>Categoría</span></div>
      <div class="pill">Shelters / refugios (fijo en este prototipo)</div>
    </div>

    <button id="searchBtn" disabled>Buscar refugios</button>
    <div id="status"></div>

    <div class="step" id="exportStep" style="display:none; margin-top:14px; border-top:1px solid var(--panel-border); padding-top:12px;">
      <div class="step-label"><span><span class="n">5.</span>Exportar</span></div>
      <label style="display:flex; align-items:center; gap:6px; font-size:13px; color: var(--ink-dim); margin-bottom:6px;">
        <input type="radio" name="exportMode" value="both" checked> Ruta + waypoints
      </label>
      <label style="display:flex; align-items:center; gap:6px; font-size:13px; color: var(--ink-dim); margin-bottom:8px;">
        <input type="radio" name="exportMode" value="waypoints"> Solo waypoints
      </label>
      <button class="secondary" id="exportBtn">Exportar GPX</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function () {
  const map = L.map('map', { zoomControl: true }).setView([28.36, -14.05], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let trackPoints = [];      // [{lat, lon, dist}], dist = distancia acumulada en km
  let routeLine = null;      // capa Leaflet de la ruta completa
  let highlightLine = null;  // resalta el tramo A-B seleccionado
  let markerA = null, markerB = null;
  let idxA = null, idxB = null;
  let bufferLayer = null;
  let currentBuffer = null;  // { buffered, sub } — corredor vigente, para preview y para la búsqueda
  let resultsLayer = L.layerGroup().addTo(map);
  let lastResults = [];      // últimos POIs encontrados, para exportar
  let lastSub = [];          // puntos del tramo A-B usado en la última búsqueda

  const el = (id) => document.getElementById(id);
  const statusEl = el('status');
  const searchBtn = el('searchBtn');
  const radiusSlider = el('radiusSlider');
  const radiusLabel = el('radiusLabel');
  const abInstructions = el('abInstructions');
  const abKmLabel = el('abKmLabel');
  const sliderA = el('sliderA');
  const sliderB = el('sliderB');
  const abTrackFill = el('abTrackFill');
  const aKmLabel = el('aKmLabel');
  const bKmLabel = el('bKmLabel');
  const resetABBtn = el('resetAB');
  const exportStep = el('exportStep');
  const exportBtn = el('exportBtn');

  radiusSlider.addEventListener('input', () => {
    radiusLabel.textContent = radiusSlider.value + ' m';
    computeBufferPreview();
  });

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = isErr ? 'err' : '';
  }

  // --- Haversine en km ---
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // --- Parseo de GPX respetando segmentos/tracks separados ---
  // Un GPX puede tener varios <trk>, y cada <trk> varios <trkseg> (p.ej. por
  // pausas al grabar). Unir todos los trkpt en una sola lista, sin respetar
  // esos cortes, hace que se dibuje una línea recta uniendo el final de un
  // segmento con el inicio del siguiente aunque estén lejos entre sí — el
  // efecto de "conecta puntos donde no debe". Por eso aquí se agrupan por
  // segmento y, en este prototipo, se usa solo el segmento más largo.
  function segLength(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) {
      d += haversine(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon);
    }
    return d;
  }

  function parseGPX(text) {
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    const segments = [];

    const trkSegs = Array.from(xml.getElementsByTagName('trkseg'));
    trkSegs.forEach(seg => {
      const pts = Array.from(seg.getElementsByTagName('trkpt')).map(p => ({
        lat: parseFloat(p.getAttribute('lat')),
        lon: parseFloat(p.getAttribute('lon'))
      }));
      if (pts.length >= 2) segments.push(pts);
    });

    if (segments.length === 0) {
      // Fallback: GPX de tipo ruta (rtept), o trkpt sueltos sin trkseg
      let pts = Array.from(xml.getElementsByTagName('rtept'));
      if (pts.length === 0) pts = Array.from(xml.getElementsByTagName('trkpt'));
      if (pts.length === 0) throw new Error('No se encontraron puntos trkpt/rtept en el GPX.');
      segments.push(pts.map(p => ({
        lat: parseFloat(p.getAttribute('lat')),
        lon: parseFloat(p.getAttribute('lon'))
      })));
    }

    let chosen = segments[0], chosenLen = segLength(segments[0]);
    for (let i = 1; i < segments.length; i++) {
      const len = segLength(segments[i]);
      if (len > chosenLen) { chosen = segments[i]; chosenLen = len; }
    }

    let dist = 0;
    chosen[0].dist = 0;
    for (let i = 1; i < chosen.length; i++) {
      dist += haversine(chosen[i-1].lat, chosen[i-1].lon, chosen[i].lat, chosen[i].lon);
      chosen[i].dist = dist;
    }
    chosen._meta = { totalSegments: segments.length, usedLengthKm: dist };
    return chosen;
  }

  function loadRoute(points) {
    trackPoints = points;
    if (markerA) { map.removeLayer(markerA); markerA = null; }
    if (markerB) { map.removeLayer(markerB); markerB = null; }
    if (routeLine) map.removeLayer(routeLine);
    if (highlightLine) { map.removeLayer(highlightLine); highlightLine = null; }
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    resultsLayer.clearLayers();
    exportStep.style.display = 'none';
    lastResults = []; lastSub = []; currentBuffer = null;

    const latlngs = points.map(p => [p.lat, p.lon]);
    routeLine = L.polyline(latlngs, { color: '#5fb488', weight: 4, opacity: 0.85 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [20, 20] });

    // A al inicio, B al final por defecto. Los marcadores son solo indicativos
    // sobre el mapa — la posición se controla con los sliders del panel.
    idxA = 0;
    idxB = points.length - 1;
    markerA = L.marker([points[idxA].lat, points[idxA].lon])
      .bindTooltip('A', { permanent: true, direction: 'top' }).addTo(map);
    markerB = L.marker([points[idxB].lat, points[idxB].lon])
      .bindTooltip('B', { permanent: true, direction: 'top' }).addTo(map);

    sliderA.min = 0; sliderA.max = points.length - 1; sliderA.value = idxA; sliderA.disabled = false;
    sliderB.min = 0; sliderB.max = points.length - 1; sliderB.value = idxB; sliderB.disabled = false;

    abInstructions.textContent = 'Ajusta los puntos A y B con los deslizadores';
    resetABBtn.style.display = 'block';
    searchBtn.disabled = false;

    updateSelection(false);

    const meta = points._meta;
    let msg = 'Ruta cargada: ' + points.length + ' puntos, ' + points[points.length-1].dist.toFixed(1) + ' km.';
    if (meta && meta.totalSegments > 1) {
      msg += ' Aviso: el GPX tenía ' + meta.totalSegments + ' segmentos/tracks separados; se ha usado solo el más largo (' + meta.usedLengthKm.toFixed(1) + ' km). Si tu ruta real está repartida en varios tramos, dímelo y lo tratamos aparte.';
    }
    setStatus(msg);
  }

  function nearestIndex(latlng) {
    let best = 0, bestD = Infinity;
    for (let i = 0; i < trackPoints.length; i++) {
      const d = haversine(latlng.lat, latlng.lng, trackPoints[i].lat, trackPoints[i].lon);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // --- Slider de rango con dos tiradores: A (valor bajo) y B (valor alto) ---
  // Dos <input type="range"> superpuestos sobre el mismo eje; cada uno solo es
  // "agarrable" por su tirador visible (el resto es transparente a los clics).
  // Se fuerza A <= B para que no se crucen.
  function onSliderAInput() {
    let v = parseInt(sliderA.value, 10);
    const vb = parseInt(sliderB.value, 10);
    if (v > vb) { v = vb; sliderA.value = v; }
    idxA = v;
    markerA.setLatLng([trackPoints[idxA].lat, trackPoints[idxA].lon]);
    updateSelection();
  }
  function onSliderBInput() {
    let v = parseInt(sliderB.value, 10);
    const va = parseInt(sliderA.value, 10);
    if (v < va) { v = va; sliderB.value = v; }
    idxB = v;
    markerB.setLatLng([trackPoints[idxB].lat, trackPoints[idxB].lon]);
    updateSelection();
  }
  sliderA.addEventListener('input', onSliderAInput);
  sliderB.addEventListener('input', onSliderBInput);
  sliderA.addEventListener('change', () => { if (lastResults.length) setStatus('El tramo ha cambiado — pulsa "Buscar refugios" para actualizar los resultados.'); });
  sliderB.addEventListener('change', () => { if (lastResults.length) setStatus('El tramo ha cambiado — pulsa "Buscar refugios" para actualizar los resultados.'); });
  // Trae al frente el tirador que se está tocando, para poder agarrarlo aunque
  // ambos tiradores coincidan en la misma posición.
  sliderA.addEventListener('pointerdown', () => { sliderA.style.zIndex = 3; sliderB.style.zIndex = 2; });
  sliderB.addEventListener('pointerdown', () => { sliderB.style.zIndex = 3; sliderA.style.zIndex = 2; });

  function updateTrackFill() {
    const min = parseInt(sliderA.min, 10), max = parseInt(sliderA.max, 10) || 1;
    const span = (max - min) || 1;
    const pctA = ((idxA - min) / span) * 100;
    const pctB = ((idxB - min) / span) * 100;
    abTrackFill.style.left = pctA + '%';
    abTrackFill.style.width = (pctB - pctA) + '%';
  }

  function updateSelection() {
    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    const km = (trackPoints[hi].dist - trackPoints[lo].dist).toFixed(1);
    abKmLabel.textContent = km + ' km';
    aKmLabel.textContent = trackPoints[idxA].dist.toFixed(1) + ' km';
    bKmLabel.textContent = trackPoints[idxB].dist.toFixed(1) + ' km';
    updateTrackFill();

    if (highlightLine) map.removeLayer(highlightLine);
    const sub = trackPoints.slice(lo, hi + 1).map(p => [p.lat, p.lon]);
    highlightLine = L.polyline(sub, { color: '#d98a4f', weight: 5, opacity: 0.95 }).addTo(map);

    searchBtn.disabled = (lo === hi);
    computeBufferPreview();
  }

  // --- Vista previa del corredor de búsqueda (polígono-serpiente) ---
  // Se recalcula cada vez que cambia el tramo o el radio, para ver antes de
  // buscar dónde se va a buscar exactamente.
  function computeBufferPreview() {
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    if (idxA === null || idxB === null || !trackPoints.length) { currentBuffer = null; return; }

    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    const sub = trackPoints.slice(lo, hi + 1);
    if (sub.length < 2) { currentBuffer = null; return; }

    const line = turf.lineString(sub.map(p => [p.lon, p.lat]));
    const radiusM = parseInt(radiusSlider.value, 10);
    let buffered = turf.buffer(line, radiusM / 1000, { units: 'kilometers', steps: 6 });
    buffered = turf.simplify(buffered, { tolerance: 0.0004, highQuality: false });

    if (buffered.geometry.type === 'MultiPolygon') {
      // Prototipo: si el buffer se parte en varios polígonos, usamos el de mayor área
      let best = null, bestArea = -1;
      buffered.geometry.coordinates.forEach(coords => {
        const poly = turf.polygon(coords);
        const a = turf.area(poly);
        if (a > bestArea) { bestArea = a; best = poly; }
      });
      buffered = best;
    }

    bufferLayer = L.geoJSON(buffered, {
      style: { color: '#d98a4f', weight: 1, fillColor: '#d98a4f', fillOpacity: 0.12 }
    }).addTo(map);

    currentBuffer = { buffered, sub };
  }

  resetABBtn.addEventListener('click', () => {
    idxA = 0;
    idxB = trackPoints.length - 1;
    sliderA.value = idxA;
    sliderB.value = idxB;
    markerA.setLatLng([trackPoints[idxA].lat, trackPoints[idxA].lon]);
    markerB.setLatLng([trackPoints[idxB].lat, trackPoints[idxB].lon]);
    updateSelection();
    if (lastResults.length) setStatus('El tramo ha cambiado — pulsa "Buscar refugios" para actualizar los resultados.');
  });

  el('gpxFile').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const points = parseGPX(reader.result);
        loadRoute(points);
      } catch (err) {
        setStatus('Error al leer el GPX: ' + err.message, true);
      }
    };
    reader.readAsText(file);
  });

  // --- Construir el polígono-serpiente y consultar Overpass ---
  function polyToOverpassString(polygonFeature) {
    // polygonFeature: Feature<Polygon> de turf, coords en [lon, lat]
    const ring = polygonFeature.geometry.coordinates[0];
    return ring.map(c => c[1].toFixed(6) + ' ' + c[0].toFixed(6)).join(' ');
  }

  async function searchShelters() {
    if (idxA === null || idxB === null) return;
    computeBufferPreview(); // asegura que el corredor está actualizado con el tramo/radio actuales
    if (!currentBuffer) {
      setStatus('El tramo seleccionado es demasiado corto.', true);
      return;
    }
    searchBtn.disabled = true;
    setStatus('Consultando Overpass…');
    resultsLayer.clearLayers();

    lastSub = currentBuffer.sub;
    const polyStr = polyToOverpassString(currentBuffer.buffered);
    const query = `[out:json][timeout:25];(
      node["amenity"="shelter"](poly:"${polyStr}");
      way["amenity"="shelter"](poly:"${polyStr}");
      node["tourism"="wilderness_hut"](poly:"${polyStr}");
      node["tourism"="alpine_hut"](poly:"${polyStr}");
    );out center;`;

    const mirrors = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.ru/api/interpreter'
    ];
    let lastErr = null;
    for (let i = 0; i < mirrors.length; i++) {
      try {
        setStatus('Consultando Overpass' + (i > 0 ? ' (mirror ' + (i+1) + ')' : '') + '…');
        const resp = await fetch(mirrors[i], {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        if (!resp.ok) throw new Error('respondió ' + resp.status);
        const data = await resp.json();
        renderResults(data.elements || []);
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
      }
    }
    if (lastErr) {
      setStatus('Error consultando Overpass tras probar ' + mirrors.length + ' mirrors: ' + lastErr.message + '. Si el archivo se abrió con doble clic (file://), prueba a abrirlo dentro de una pestaña normal del navegador.', true);
    }
    searchBtn.disabled = false;
  }

  function renderResults(elements) {
    lastResults = [];
    elements.forEach(el2 => {
      const lat = el2.lat !== undefined ? el2.lat : (el2.center ? el2.center.lat : null);
      const lon = el2.lon !== undefined ? el2.lon : (el2.center ? el2.center.lon : null);
      if (lat === null || lon === null) return;
      const tags = el2.tags || {};
      const name = tags.name || 'Refugio sin nombre';
      const tipo = tags.tourism || tags.amenity || '';
      const marker = L.circleMarker([lat, lon], {
        radius: 7, color: '#d98a4f', weight: 2, fillColor: '#d98a4f', fillOpacity: 0.7
      }).bindPopup('<b>' + name + '</b><br>' + tipo);
      resultsLayer.addLayer(marker);
      lastResults.push({ lat, lon, name, tipo });
    });
    setStatus(lastResults.length + ' refugio(s) encontrado(s) en el corredor.');
    exportStep.style.display = lastResults.length ? 'block' : 'none';
  }

  // --- Exportar a GPX: ruta (tramo A-B) + waypoints, o solo waypoints ---
  function escapeXml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildGPX(mode) {
    const parts = [];
    parts.push('<?xml version="1.0" encoding="UTF-8"?>');
    parts.push('<gpx version="1.1" creator="EnRuta" xmlns="http://www.topografix.com/GPX/1/1">');

    lastResults.forEach(r => {
      parts.push('  <wpt lat="' + r.lat.toFixed(6) + '" lon="' + r.lon.toFixed(6) + '">');
      parts.push('    <name>' + escapeXml(r.name) + '</name>');
      parts.push('    <type>' + escapeXml(r.tipo) + '</type>');
      parts.push('  </wpt>');
    });

    if (mode === 'both' && lastSub.length > 1) {
      parts.push('  <trk><name>EnRuta - tramo</name><trkseg>');
      lastSub.forEach(p => {
        parts.push('    <trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lon.toFixed(6) + '"></trkpt>');
      });
      parts.push('  </trkseg></trk>');
    }

    parts.push('</gpx>');
    return parts.join('\n');
  }

  exportBtn.addEventListener('click', () => {
    if (!lastResults.length) return;
    const mode = document.querySelector('input[name="exportMode"]:checked').value;
    const gpxText = buildGPX(mode);
    const blob = new Blob([gpxText], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'enruta-shelters' + (mode === 'waypoints' ? '-waypoints' : '') + '.gpx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  searchBtn.addEventListener('click', searchShelters);
})();
</script>
</body>
</html>
