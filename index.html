<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rutero de tramo — prototipo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #1c2521;
    --panel: #23302b;
    --panel-border: #35453d;
    --ink: #e8ece9;
    --ink-dim: #9fb0a7;
    --accent: #5fb488;
    --accent-dim: #3d7e5e;
    --warn: #d98a4f;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #map { flex: 1 1 auto; min-height: 0; }
  #panel {
    flex: 0 0 auto;
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    padding: 12px 14px 16px;
    max-height: 48vh;
    overflow-y: auto;
  }
  h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; letter-spacing: 0.2px; }
  .step { margin-bottom: 12px; }
  .step-label { font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .step-label .n { color: var(--accent); font-weight: 600; margin-right: 4px; }
  input[type="file"] {
    width: 100%; font-size: 13px; color: var(--ink-dim);
  }
  button {
    background: var(--accent-dim); color: var(--ink); border: none; border-radius: var(--radius);
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button:disabled { background: #33403a; color: var(--ink-dim); cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--ink-dim); font-weight: 500; margin-top: 6px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .radius-value { color: var(--accent); font-weight: 700; }
  #status { font-size: 13px; color: var(--ink-dim); margin-top: 10px; line-height: 1.4; min-height: 18px; }
  #status.err { color: var(--warn); }
  .pill { display: inline-block; background: var(--panel-border); color: var(--ink-dim); font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-top: 4px; }
  .leaflet-popup-content { font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <h1>Rutero de tramo · prototipo</h1>

    <div class="step">
      <div class="step-label"><span><span class="n">1.</span>Importar ruta (GPX)</span></div>
      <input type="file" id="gpxFile" accept=".gpx" />
    </div>

    <div class="step">
      <div class="step-label"><span><span class="n">2.</span>Elegir tramo A → B</span></div>
      <div id="abInstructions" class="pill">Carga una ruta primero</div>
      <button class="secondary" id="resetAB" style="display:none;">Reiniciar selección</button>
    </div>

    <div class="step">
      <div class="step-label">
        <span><span class="n">3.</span>Radio de búsqueda</span>
        <span class="radius-value" id="radiusLabel">120 m</span>
      </div>
      <input type="range" id="radiusSlider" min="50" max="500" step="10" value="120" />
    </div>

    <div class="step">
      <div class="step-label"><span><span class="n">4.</span>Categoría</span></div>
      <div class="pill">Shelters / refugios (fijo en este prototipo)</div>
    </div>

    <button id="searchBtn" disabled>Buscar refugios</button>
    <div id="status"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function () {
  const map = L.map('map', { zoomControl: true }).setView([28.36, -14.05], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  let trackPoints = [];      // [{lat, lon, dist}], dist = distancia acumulada en km
  let routeLine = null;      // capa Leaflet de la ruta completa
  let markerA = null, markerB = null;
  let idxA = null, idxB = null;
  let bufferLayer = null;
  let resultsLayer = L.layerGroup().addTo(map);

  const el = (id) => document.getElementById(id);
  const statusEl = el('status');
  const searchBtn = el('searchBtn');
  const radiusSlider = el('radiusSlider');
  const radiusLabel = el('radiusLabel');
  const abInstructions = el('abInstructions');
  const resetABBtn = el('resetAB');

  radiusSlider.addEventListener('input', () => {
    radiusLabel.textContent = radiusSlider.value + ' m';
  });

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = isErr ? 'err' : '';
  }

  // --- Haversine en km ---
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // --- Parseo de GPX respetando segmentos/tracks separados ---
  // Un GPX puede tener varios <trk>, y cada <trk> varios <trkseg> (p.ej. por
  // pausas al grabar). Unir todos los trkpt en una sola lista, sin respetar
  // esos cortes, hace que se dibuje una línea recta uniendo el final de un
  // segmento con el inicio del siguiente aunque estén lejos entre sí — el
  // efecto de "conecta puntos donde no debe". Por eso aquí se agrupan por
  // segmento y, en este prototipo, se usa solo el segmento más largo.
  function segLength(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) {
      d += haversine(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon);
    }
    return d;
  }

  function parseGPX(text) {
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    const segments = [];

    const trkSegs = Array.from(xml.getElementsByTagName('trkseg'));
    trkSegs.forEach(seg => {
      const pts = Array.from(seg.getElementsByTagName('trkpt')).map(p => ({
        lat: parseFloat(p.getAttribute('lat')),
        lon: parseFloat(p.getAttribute('lon'))
      }));
      if (pts.length >= 2) segments.push(pts);
    });

    if (segments.length === 0) {
      // Fallback: GPX de tipo ruta (rtept), o trkpt sueltos sin trkseg
      let pts = Array.from(xml.getElementsByTagName('rtept'));
      if (pts.length === 0) pts = Array.from(xml.getElementsByTagName('trkpt'));
      if (pts.length === 0) throw new Error('No se encontraron puntos trkpt/rtept en el GPX.');
      segments.push(pts.map(p => ({
        lat: parseFloat(p.getAttribute('lat')),
        lon: parseFloat(p.getAttribute('lon'))
      })));
    }

    let chosen = segments[0], chosenLen = segLength(segments[0]);
    for (let i = 1; i < segments.length; i++) {
      const len = segLength(segments[i]);
      if (len > chosenLen) { chosen = segments[i]; chosenLen = len; }
    }

    let dist = 0;
    chosen[0].dist = 0;
    for (let i = 1; i < chosen.length; i++) {
      dist += haversine(chosen[i-1].lat, chosen[i-1].lon, chosen[i].lat, chosen[i].lon);
      chosen[i].dist = dist;
    }
    chosen._meta = { totalSegments: segments.length, usedLengthKm: dist };
    return chosen;
  }

  function loadRoute(points) {
    trackPoints = points;
    idxA = null; idxB = null;
    if (markerA) { map.removeLayer(markerA); markerA = null; }
    if (markerB) { map.removeLayer(markerB); markerB = null; }
    if (routeLine) map.removeLayer(routeLine);
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    resultsLayer.clearLayers();

    const latlngs = points.map(p => [p.lat, p.lon]);
    routeLine = L.polyline(latlngs, { color: '#5fb488', weight: 4, opacity: 0.85 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [20, 20] });

    routeLine.on('click', onRouteClick);
    abInstructions.textContent = 'Toca la ruta para elegir el punto A';
    resetABBtn.style.display = 'none';
    searchBtn.disabled = true;

    const meta = points._meta;
    let msg = 'Ruta cargada: ' + points.length + ' puntos, ' + points[points.length-1].dist.toFixed(1) + ' km.';
    if (meta && meta.totalSegments > 1) {
      msg += ' Aviso: el GPX tenía ' + meta.totalSegments + ' segmentos/tracks separados; se ha usado solo el más largo (' + meta.usedLengthKm.toFixed(1) + ' km). Si tu ruta real está repartida en varios tramos, dímelo y lo tratamos aparte.';
    }
    setStatus(msg);
  }

  function nearestIndex(latlng) {
    let best = 0, bestD = Infinity;
    for (let i = 0; i < trackPoints.length; i++) {
      const d = haversine(latlng.lat, latlng.lng, trackPoints[i].lat, trackPoints[i].lon);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function onRouteClick(e) {
    const idx = nearestIndex(e.latlng);
    const p = trackPoints[idx];
    if (idxA === null) {
      idxA = idx;
      markerA = L.marker([p.lat, p.lon], { title: 'A' })
        .bindTooltip('A', { permanent: true, direction: 'top' }).addTo(map);
      abInstructions.textContent = 'Punto A fijado. Ahora toca la ruta para elegir el punto B';
      resetABBtn.style.display = 'block';
    } else if (idxB === null) {
      idxB = idx;
      markerB = L.marker([p.lat, p.lon], { title: 'B' })
        .bindTooltip('B', { permanent: true, direction: 'top' }).addTo(map);
      const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
      const km = (trackPoints[hi].dist - trackPoints[lo].dist).toFixed(1);
      abInstructions.textContent = 'Tramo seleccionado: ' + km + ' km';
      searchBtn.disabled = false;
    }
    // si ya hay A y B, un tercer clic no hace nada hasta reiniciar
  }

  resetABBtn.addEventListener('click', () => {
    idxA = null; idxB = null;
    if (markerA) { map.removeLayer(markerA); markerA = null; }
    if (markerB) { map.removeLayer(markerB); markerB = null; }
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    resultsLayer.clearLayers();
    abInstructions.textContent = 'Toca la ruta para elegir el punto A';
    resetABBtn.style.display = 'none';
    searchBtn.disabled = true;
    setStatus('');
  });

  el('gpxFile').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const points = parseGPX(reader.result);
        loadRoute(points);
      } catch (err) {
        setStatus('Error al leer el GPX: ' + err.message, true);
      }
    };
    reader.readAsText(file);
  });

  // --- Construir el polígono-serpiente y consultar Overpass ---
  function polyToOverpassString(polygonFeature) {
    // polygonFeature: Feature<Polygon> de turf, coords en [lon, lat]
    const ring = polygonFeature.geometry.coordinates[0];
    return ring.map(c => c[1].toFixed(6) + ' ' + c[0].toFixed(6)).join(' ');
  }

  async function searchShelters() {
    if (idxA === null || idxB === null) return;
    searchBtn.disabled = true;
    setStatus('Generando corredor de búsqueda…');
    resultsLayer.clearLayers();
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }

    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    const sub = trackPoints.slice(lo, hi + 1);
    if (sub.length < 2) {
      setStatus('El tramo seleccionado es demasiado corto.', true);
      searchBtn.disabled = false;
      return;
    }

    const line = turf.lineString(sub.map(p => [p.lon, p.lat]));
    const radiusM = parseInt(radiusSlider.value, 10);
    let buffered = turf.buffer(line, radiusM / 1000, { units: 'kilometers', steps: 6 });
    buffered = turf.simplify(buffered, { tolerance: 0.0004, highQuality: false });

    if (buffered.geometry.type === 'MultiPolygon') {
      // Prototipo: si el buffer se parte en varios polígonos, usamos el de mayor área
      let best = null, bestArea = -1;
      buffered.geometry.coordinates.forEach(coords => {
        const poly = turf.polygon(coords);
        const a = turf.area(poly);
        if (a > bestArea) { bestArea = a; best = poly; }
      });
      buffered = best;
    }

    bufferLayer = L.geoJSON(buffered, {
      style: { color: '#d98a4f', weight: 1, fillColor: '#d98a4f', fillOpacity: 0.12 }
    }).addTo(map);

    const polyStr = polyToOverpassString(buffered);
    const query = `[out:json][timeout:25];(
      node["amenity"="shelter"](poly:"${polyStr}");
      way["amenity"="shelter"](poly:"${polyStr}");
      node["tourism"="wilderness_hut"](poly:"${polyStr}");
      node["tourism"="alpine_hut"](poly:"${polyStr}");
    );out center;`;

    setStatus('Consultando Overpass…');
    const mirrors = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.ru/api/interpreter'
    ];
    let lastErr = null;
    for (let i = 0; i < mirrors.length; i++) {
      try {
        setStatus('Consultando Overpass' + (i > 0 ? ' (mirror ' + (i+1) + ')' : '') + '…');
        const resp = await fetch(mirrors[i], {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        });
        if (!resp.ok) throw new Error('respondió ' + resp.status);
        const data = await resp.json();
        renderResults(data.elements || []);
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
      }
    }
    if (lastErr) {
      setStatus('Error consultando Overpass tras probar ' + mirrors.length + ' mirrors: ' + lastErr.message + '. Si el archivo se abrió con doble clic (file://), prueba a abrirlo dentro de una pestaña normal del navegador.', true);
    }
    searchBtn.disabled = false;
  }

  function renderResults(elements) {
    let count = 0;
    elements.forEach(el2 => {
      const lat = el2.lat !== undefined ? el2.lat : (el2.center ? el2.center.lat : null);
      const lon = el2.lon !== undefined ? el2.lon : (el2.center ? el2.center.lon : null);
      if (lat === null || lon === null) return;
      const tags = el2.tags || {};
      const name = tags.name || 'Refugio sin nombre';
      const tipo = tags.tourism || tags.amenity || '';
      const marker = L.circleMarker([lat, lon], {
        radius: 7, color: '#d98a4f', weight: 2, fillColor: '#d98a4f', fillOpacity: 0.7
      }).bindPopup('<b>' + name + '</b><br>' + tipo);
      resultsLayer.addLayer(marker);
      count++;
    });
    setStatus(count + ' refugio(s) encontrado(s) en el corredor.');
  }

  searchBtn.addEventListener('click', searchShelters);
})();
</script>
</body>
</html>
