<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EnRuta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #1c2521;
    --panel: #23302b;
    --panel-border: #35453d;
    --ink: #e8ece9;
    --ink-dim: #9fb0a7;
    --accent: #5fb488;
    --accent-dim: #3d7e5e;
    --warn: #d98a4f;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: relative; height: 100%; overflow: hidden; }
  #map { position: absolute; inset: 0; }

  /* --- Botones flotantes circulares (GPS, ajustes) --- */
  .fab {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--panel-border); color: var(--ink);
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.35); z-index: 1000; padding: 0;
  }
  .fab.active { background: var(--accent-dim); border-color: var(--accent); }
  #settingsBtn { position: fixed; top: 16px; right: 16px; }
  #gpsBtn { position: fixed; top: 16px; right: 72px; }

  /* --- Tarjeta flotante de ajustes: solo importar / guardar / gestionar --- */
  .floating-card {
    position: fixed; top: 76px; right: 16px; left: 16px; margin-left: auto;
    max-width: 380px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 14px; z-index: 1000; max-height: 74vh; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .floating-card[hidden] { display: none; }
  .card-header { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .step-label { font-size: 12px; color: var(--ink-dim); margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
  .radius-value { color: var(--accent); font-weight: 700; }
  .pill { display: inline-block; background: var(--panel-border); color: var(--ink-dim); font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-top: 4px; }
  input[type="file"] { width: 100%; font-size: 13px; color: var(--ink-dim); }
  input[type="text"] {
    background: var(--bg); border: 1px solid var(--panel-border); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%;
  }
  button {
    background: var(--accent-dim); color: var(--ink); border: none; border-radius: var(--radius);
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.wide { width: 100%; }
  button:disabled { background: #33403a; color: var(--ink-dim); cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--ink-dim); font-weight: 500; }
  button.btn-sm { padding: 6px 10px; font-size: 12px; }
  .card-status { font-size: 12px; color: var(--ink-dim); margin-top: 10px; line-height: 1.4; min-height: 16px; }
  .card-status.err { color: var(--warn); }

  /* --- Rutas guardadas --- */
  #savedRoutesSection { margin-top: 14px; border-top: 1px solid var(--panel-border); padding-top: 10px; }
  .saved-route-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .saved-route-info { font-size: 13px; line-height: 1.3; }
  .saved-route-info .dim { color: var(--ink-dim); font-size: 11px; }
  .saved-route-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* --- Barra flotante sobre el mapa: tramo, radio y buscar --- */
  /* Compacta y siempre visible con la ruta cargada, para no tapar el mapa
     como hacía la tarjeta grande mientras se juega con los sliders. */
  .route-bar {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    background: rgba(35,48,43,0.95); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 12px 14px 14px; z-index: 950;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .route-bar[hidden] { display: none; }
  .rb-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); }
  .minmax-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); margin-top: 2px; }
  .rb-results { font-size: 12px; color: var(--ink-dim); text-align: center; margin-top: 8px; }
  .rb-results[hidden] { display: none; }
  .rb-export { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .rb-export[hidden] { display: none; }

  /* --- Selección de categorías --- */
  .cat-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .cat-chip {
    display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-dim);
    background: var(--bg); border: 1px solid var(--panel-border); padding: 5px 9px;
    border-radius: 999px; cursor: pointer;
  }
  .cat-chip input { accent-color: var(--accent); margin: 0; }

  /* --- Selector de capas de mapa --- */
  .layer-option {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink);
    padding: 8px 4px; cursor: pointer; border-radius: 8px;
  }
  .layer-option input { accent-color: var(--accent); margin: 0; }

  /* --- Barra de progreso indeterminada mientras se busca --- */
  .progress-bar { height: 4px; background: var(--panel-border); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-bar[hidden] { display: none; }
  .progress-bar-fill {
    width: 40%; height: 100%; background: var(--accent); border-radius: 2px;
    animation: indeterminate 1.1s infinite ease-in-out;
  }
  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .rb-results.err { color: var(--warn); }

  /* --- Marcadores de resultado: círculo de color con una letra --- */
  .poi-marker {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 13px; color: #1c2521;
    border: 2px solid var(--bg); box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .poi-shelter { background: #d98a4f; }
  .poi-water { background: #4a90d9; }
  .poi-shop { background: #d9b64f; }

  /* --- Slider de rango con dos tiradores --- */
  .range-slider { position: relative; height: 26px; margin-top: 8px; }
  .range-slider .track {
    position: absolute; top: 50%; left: 0; right: 0; height: 4px;
    background: var(--panel-border); border-radius: 2px; transform: translateY(-50%);
  }
  .range-slider .track-fill {
    position: absolute; top: 50%; height: 4px;
    background: var(--accent); border-radius: 2px; transform: translateY(-50%);
  }
  .range-slider input[type="range"] {
    position: absolute; top: 0; left: 0; width: 100%; height: 26px; margin: 0;
    background: transparent; -webkit-appearance: none; appearance: none; pointer-events: none;
  }
  .range-slider input[type="range"]::-webkit-slider-runnable-track { background: transparent; }
  .range-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); cursor: pointer; margin-top: 0;
  }
  .range-slider input[type="range"]::-moz-range-track { background: transparent; border: none; }
  .range-slider input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg); cursor: pointer;
  }
  input[type="range"]#radiusSlider { width: 100%; accent-color: var(--accent); margin-top: 4px; }

  /* --- Toast para avisos que deben verse aunque la tarjeta esté cerrada --- */
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--warn); color: #1c2521; padding: 8px 14px; border-radius: 8px;
    font-size: 13px; z-index: 1200; max-width: 80vw; text-align: center;
  }
  #toast[hidden] { display: none; }

  .leaflet-popup-content { font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <button id="gpsBtn" class="fab" title="Seguir mi posición">◎</button>
  <button id="settingsBtn" class="fab" title="Ajustes">⚙</button>

  <!-- Tarjeta de ajustes: solo importar / guardar / gestionar rutas -->
  <div id="settingsCard" class="floating-card" hidden>
    <div class="card-header">EnRuta</div>

    <div class="step-label"><span>Capa del mapa</span></div>
    <label class="layer-option"><input type="radio" name="mapLayer" value="osm" checked> OpenStreetMap</label>
    <label class="layer-option"><input type="radio" name="mapLayer" value="bici"> Bici (CyclOSM)</label>
    <label class="layer-option"><input type="radio" name="mapLayer" value="outdoors"> Outdoors (topográfico)</label>
    <label class="layer-option"><input type="radio" name="mapLayer" value="satellite"> Satélite</label>

    <div id="uploadSection" style="margin-top:12px; border-top:1px solid var(--panel-border); padding-top:12px;">
      <div class="step-label"><span>Importar ruta (GPX)</span></div>
      <input type="file" id="gpxFile" accept=".gpx" />
    </div>

    <div id="manageSection" hidden>
      <div class="step-label"><span>Ruta actual</span></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="saveNameInput" placeholder="Nombre de la ruta" />
        <button id="saveRouteBtn" class="secondary btn-sm">Guardar</button>
      </div>
      <button id="newRouteBtn" class="secondary wide" style="margin-top:8px;">Cargar otro GPX</button>
    </div>

    <div id="cardStatus" class="card-status"></div>

    <div id="savedRoutesSection">
      <div class="step-label"><span>Mis rutas guardadas</span></div>
      <div id="savedRoutesList"></div>
    </div>
  </div>

  <!-- Barra flotante sobre el mapa: aparece con la ruta cargada -->
  <div id="routeBar" class="route-bar" hidden>
    <div class="rb-row"><span>Tramo A → B</span><span class="radius-value" id="abKmLabel">—</span></div>
    <div class="range-slider" id="abRangeWrap">
      <div class="track"></div>
      <div class="track-fill" id="abTrackFill"></div>
      <input type="range" id="sliderA" min="0" max="0" step="1" value="0" />
      <input type="range" id="sliderB" min="0" max="0" step="1" value="0" />
    </div>
    <div class="minmax-row"><span id="aKmLabel">—</span><span id="bKmLabel">—</span></div>

    <div class="rb-row" style="margin-top:10px;"><span>Radio de búsqueda</span><span class="radius-value" id="radiusLabel">120 m</span></div>
    <input type="range" id="radiusSlider" min="50" max="500" step="10" value="120" />

    <div class="rb-row" style="margin-top:10px;"><span>Categorías</span></div>
    <div class="cat-row">
      <label class="cat-chip"><input type="checkbox" id="catShelter" checked> Refugios</label>
      <label class="cat-chip"><input type="checkbox" id="catWater" checked> Agua</label>
      <label class="cat-chip"><input type="checkbox" id="catShop" checked> Tiendas</label>
    </div>

    <button id="searchBtn" class="wide" style="margin-top:10px;">Buscar</button>
    <div id="searchProgress" class="progress-bar" hidden><div class="progress-bar-fill"></div></div>

    <div id="resultsCountLabel" class="rb-results" hidden></div>
    <div id="rbExport" class="rb-export" hidden>
      <button id="exportWaypoints" class="secondary btn-sm">Solo waypoints</button>
      <button id="exportBoth" class="secondary btn-sm">Ruta + waypoints</button>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
(function () {
  // Vista inicial: Dinamarca
  const map = L.map('map', { zoomControl: true }).setView([56.2639, 9.5018], 7);

  const baseLayers = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }),
    bici: L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
      maxZoom: 20, attribution: '&copy; OpenStreetMap contributors, CyclOSM'
    }),
    outdoors: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17, attribution: '&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)'
    }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Tiles &copy; Esri'
    })
  };
  let currentBaseLayer = baseLayers.osm.addTo(map);

  function setBaseLayer(key) {
    if (!baseLayers[key] || baseLayers[key] === currentBaseLayer) return;
    map.removeLayer(currentBaseLayer);
    currentBaseLayer = baseLayers[key].addTo(map);
  }

  let trackPoints = [];
  let routeLine = null;
  let highlightLine = null;
  let markerA = null, markerB = null;
  let idxA = null, idxB = null;
  let bufferLayer = null;
  let currentBuffer = null;
  let resultsLayer = L.layerGroup().addTo(map);
  let lastResults = [];
  let lastSub = [];

  const el = (id) => document.getElementById(id);
  const settingsBtn = el('settingsBtn');
  const settingsCard = el('settingsCard');
  const uploadSection = el('uploadSection');
  const manageSection = el('manageSection');
  const cardStatus = el('cardStatus');
  const routeBar = el('routeBar');
  const searchBtn = el('searchBtn');
  const radiusSlider = el('radiusSlider');
  const radiusLabel = el('radiusLabel');
  const abKmLabel = el('abKmLabel');
  const sliderA = el('sliderA');
  const sliderB = el('sliderB');
  const abTrackFill = el('abTrackFill');
  const aKmLabel = el('aKmLabel');
  const bKmLabel = el('bKmLabel');
  const newRouteBtn = el('newRouteBtn');
  const saveNameInput = el('saveNameInput');
  const saveRouteBtn = el('saveRouteBtn');
  const savedRoutesList = el('savedRoutesList');
  const resultsCountLabel = el('resultsCountLabel');
  const rbExport = el('rbExport');
  const searchProgress = el('searchProgress');
  const catShelter = el('catShelter');
  const catWater = el('catWater');
  const catShop = el('catShop');
  const exportBoth = el('exportBoth');
  const exportWaypoints = el('exportWaypoints');
  const toast = el('toast');
  const gpsBtn = el('gpsBtn');

  document.querySelectorAll('input[name="mapLayer"]').forEach(radio => {
    radio.addEventListener('change', () => { if (radio.checked) setBaseLayer(radio.value); });
  });

  // --- Utilidades de estado / avisos ---
  function setStatus(msg, isErr) {
    cardStatus.textContent = msg;
    cardStatus.className = 'card-status' + (isErr ? ' err' : '');
    if (isErr) showToast(msg);
  }
  let toastTimer = null;
  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, ms || 3500);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // --- Categorías de búsqueda: refugio (R), agua potable (A), tienda (T) ---
  const CAT_META = {
    shelter: { letter: 'R', label: 'Refugio' },
    water:   { letter: 'A', label: 'Agua' },
    shop:    { letter: 'T', label: 'Tienda' }
  };
  function anyCategorySelected() {
    return catShelter.checked || catWater.checked || catShop.checked;
  }
  function refreshSearchAvailability() {
    if (idxA === null || idxB === null) return;
    searchBtn.disabled = (idxA === idxB) || !anyCategorySelected();
  }
  [catShelter, catWater, catShop].forEach(cb => cb.addEventListener('change', refreshSearchAvailability));

  function classifyTags(tags) {
    if (tags.amenity === 'shelter' || tags.tourism === 'wilderness_hut' || tags.tourism === 'alpine_hut') return 'shelter';
    if (tags.amenity === 'drinking_water' || tags.man_made === 'water_tap' || tags.amenity === 'water_point') return 'water';
    if (tags.shop === 'supermarket' || tags.shop === 'convenience') return 'shop';
    return null;
  }
  function makeDivIcon(type) {
    return L.divIcon({
      className: '',
      html: '<div class="poi-marker poi-' + type + '">' + CAT_META[type].letter + '</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13]
    });
  }

  settingsBtn.addEventListener('click', () => {
    settingsCard.hidden = !settingsCard.hidden;
    if (!settingsCard.hidden) refreshSavedRoutes();
  });

  // --- Haversine en km ---
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // --- Parseo de GPX respetando segmentos/tracks separados ---
  function segLength(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) d += haversine(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon);
    return d;
  }

  function parseGPX(text) {
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    const segments = [];
    const trkSegs = Array.from(xml.getElementsByTagName('trkseg'));
    trkSegs.forEach(seg => {
      const pts = Array.from(seg.getElementsByTagName('trkpt')).map(p => ({
        lat: parseFloat(p.getAttribute('lat')), lon: parseFloat(p.getAttribute('lon'))
      }));
      if (pts.length >= 2) segments.push(pts);
    });
    if (segments.length === 0) {
      let pts = Array.from(xml.getElementsByTagName('rtept'));
      if (pts.length === 0) pts = Array.from(xml.getElementsByTagName('trkpt'));
      if (pts.length === 0) throw new Error('No se encontraron puntos trkpt/rtept en el GPX.');
      segments.push(pts.map(p => ({ lat: parseFloat(p.getAttribute('lat')), lon: parseFloat(p.getAttribute('lon')) })));
    }
    let chosen = segments[0], chosenLen = segLength(segments[0]);
    for (let i = 1; i < segments.length; i++) {
      const len = segLength(segments[i]);
      if (len > chosenLen) { chosen = segments[i]; chosenLen = len; }
    }
    let dist = 0;
    chosen[0].dist = 0;
    for (let i = 1; i < chosen.length; i++) {
      dist += haversine(chosen[i-1].lat, chosen[i-1].lon, chosen[i].lat, chosen[i].lon);
      chosen[i].dist = dist;
    }
    chosen._meta = { totalSegments: segments.length, usedLengthKm: dist };
    return chosen;
  }

  // --- Cargar una ruta en el mapa (GPX nuevo o restaurada desde IndexedDB) ---
  function loadRoute(points, restoreState) {
    if (markerA) { map.removeLayer(markerA); markerA = null; }
    if (markerB) { map.removeLayer(markerB); markerB = null; }
    if (routeLine) map.removeLayer(routeLine);
    if (highlightLine) { map.removeLayer(highlightLine); highlightLine = null; }
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    resultsLayer.clearLayers();
    lastResults = []; lastSub = []; currentBuffer = null;

    trackPoints = points;
    const latlngs = points.map(p => [p.lat, p.lon]);
    routeLine = L.polyline(latlngs, { color: '#5fb488', weight: 4, opacity: 0.85 }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [20, 90] });

    idxA = restoreState ? clamp(restoreState.idxA, 0, points.length - 1) : 0;
    idxB = restoreState ? clamp(restoreState.idxB, 0, points.length - 1) : points.length - 1;
    const radiusVal = (restoreState && restoreState.radius) ? restoreState.radius : 120;
    radiusSlider.value = radiusVal;
    radiusLabel.textContent = radiusVal + ' m';

    markerA = L.marker([points[idxA].lat, points[idxA].lon]).bindTooltip('A', { permanent: true, direction: 'top' }).addTo(map);
    markerB = L.marker([points[idxB].lat, points[idxB].lon]).bindTooltip('B', { permanent: true, direction: 'top' }).addTo(map);

    sliderA.min = 0; sliderA.max = points.length - 1; sliderA.value = idxA;
    sliderB.min = 0; sliderB.max = points.length - 1; sliderB.value = idxB;

    if (restoreState && restoreState.results && restoreState.results.length) {
      restoreState.results.forEach(r => {
        const type = r.type || 'shelter';
        const marker = L.marker([r.lat, r.lon], { icon: makeDivIcon(type) })
          .bindPopup('<b>' + r.name + '</b><br>' + (CAT_META[type] ? CAT_META[type].label : ''));
        resultsLayer.addLayer(marker);
        lastResults.push(r);
      });
      const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
      lastSub = trackPoints.slice(lo, hi + 1);
    }

    updateSelection();
    if (lastResults.length) {
      const counts = { shelter: 0, water: 0, shop: 0 };
      lastResults.forEach(r => { if (counts[r.type] !== undefined) counts[r.type]++; });
      updateResultsUI(counts);
    } else {
      resultsCountLabel.hidden = true;
      rbExport.hidden = true;
    }

    // La tarjeta de ajustes pasa a modo "gestionar" (guardar / cargar otro),
    // se cierra sola y deja el mapa + la barra flotante a la vista.
    uploadSection.hidden = true;
    manageSection.hidden = false;
    routeBar.hidden = false;
    settingsCard.hidden = true;

    const meta = points._meta;
    let msg = 'Ruta cargada: ' + points.length + ' puntos, ' + points[points.length-1].dist.toFixed(1) + ' km.';
    if (meta && meta.totalSegments > 1) {
      msg += ' Aviso: el GPX tenía ' + meta.totalSegments + ' segmentos/tracks separados; se ha usado solo el más largo (' + meta.usedLengthKm.toFixed(1) + ' km).';
    }
    setStatus(msg);
  }

  el('gpxFile').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    setStatus('Procesando GPX (' + (file.size / 1024).toFixed(0) + ' KB)…');
    showToast('Procesando GPX, puede tardar unos segundos con archivos grandes…', 5000);
    const reader = new FileReader();
    reader.onload = () => {
      // El setTimeout deja que el navegador pinte el aviso de arriba antes de
      // meterse en el parseo/cálculo pesado (que bloquea el hilo mientras dura).
      setTimeout(() => {
        try {
          const points = parseGPX(reader.result);
          loadRoute(points);
        } catch (err) {
          setStatus('Error al leer el GPX: ' + err.message, true);
        }
      }, 30);
    };
    reader.readAsText(file);
  });

  newRouteBtn.addEventListener('click', () => {
    trackPoints = [];
    if (markerA) { map.removeLayer(markerA); markerA = null; }
    if (markerB) { map.removeLayer(markerB); markerB = null; }
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (highlightLine) { map.removeLayer(highlightLine); highlightLine = null; }
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    resultsLayer.clearLayers();
    lastResults = []; lastSub = []; currentBuffer = null;
    el('gpxFile').value = '';
    uploadSection.hidden = false;
    manageSection.hidden = true;
    routeBar.hidden = true;
    setStatus('');
  });

  // --- Slider de rango con dos tiradores: A (valor bajo) y B (valor alto) ---
  function onSliderAInput() {
    let v = parseInt(sliderA.value, 10);
    const vb = parseInt(sliderB.value, 10);
    if (v > vb) { v = vb; sliderA.value = v; }
    idxA = v;
    markerA.setLatLng([trackPoints[idxA].lat, trackPoints[idxA].lon]);
    updateSelection();
  }
  function onSliderBInput() {
    let v = parseInt(sliderB.value, 10);
    const va = parseInt(sliderA.value, 10);
    if (v < va) { v = va; sliderB.value = v; }
    idxB = v;
    markerB.setLatLng([trackPoints[idxB].lat, trackPoints[idxB].lon]);
    updateSelection();
  }
  sliderA.addEventListener('input', onSliderAInput);
  sliderB.addEventListener('input', onSliderBInput);
  sliderA.addEventListener('change', () => { if (lastResults.length) setStatus('El tramo ha cambiado — pulsa "Buscar refugios" para actualizar los resultados.'); });
  sliderB.addEventListener('change', () => { if (lastResults.length) setStatus('El tramo ha cambiado — pulsa "Buscar refugios" para actualizar los resultados.'); });
  sliderA.addEventListener('pointerdown', () => { sliderA.style.zIndex = 3; sliderB.style.zIndex = 2; });
  sliderB.addEventListener('pointerdown', () => { sliderB.style.zIndex = 3; sliderA.style.zIndex = 2; });
  radiusSlider.addEventListener('input', () => {
    radiusLabel.textContent = radiusSlider.value + ' m';
    scheduleBufferPreview();
  });

  function updateTrackFill() {
    const min = parseInt(sliderA.min, 10), max = parseInt(sliderA.max, 10) || 1;
    const span = (max - min) || 1;
    const pctA = ((idxA - min) / span) * 100;
    const pctB = ((idxB - min) / span) * 100;
    abTrackFill.style.left = pctA + '%';
    abTrackFill.style.width = (pctB - pctA) + '%';
  }

  let bufferDebounceTimer = null;
  function scheduleBufferPreview(delay) {
    clearTimeout(bufferDebounceTimer);
    bufferDebounceTimer = setTimeout(computeBufferPreview, delay || 150);
  }

  function updateSelection() {
    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    const km = (trackPoints[hi].dist - trackPoints[lo].dist).toFixed(1);
    abKmLabel.textContent = km + ' km';
    aKmLabel.textContent = trackPoints[idxA].dist.toFixed(1) + ' km';
    bKmLabel.textContent = trackPoints[idxB].dist.toFixed(1) + ' km';
    updateTrackFill();

    if (highlightLine) map.removeLayer(highlightLine);
    const sub = trackPoints.slice(lo, hi + 1).map(p => [p.lat, p.lon]);
    highlightLine = L.polyline(sub, { color: '#d98a4f', weight: 5, opacity: 0.95 }).addTo(map);

    refreshSearchAvailability();
    scheduleBufferPreview();
  }

  function updateResultsUI(counts) {
    const n = lastResults.length;
    resultsCountLabel.hidden = false;
    resultsCountLabel.className = 'rb-results';
    rbExport.hidden = !n;
    if (!n) { resultsCountLabel.textContent = 'Sin resultados en el corredor.'; return; }
    const parts = [];
    if (counts.shelter) parts.push(counts.shelter + ' refugio' + (counts.shelter === 1 ? '' : 's'));
    if (counts.water) parts.push(counts.water + ' fuente' + (counts.water === 1 ? '' : 's') + ' de agua');
    if (counts.shop) parts.push(counts.shop + ' tienda' + (counts.shop === 1 ? '' : 's'));
    resultsCountLabel.textContent = parts.join(' · ');
  }

  // --- Vista previa del corredor de búsqueda (polígono-serpiente) ---
  // Reduce el nº de vértices que se le pasan a turf.buffer. El cálculo del
  // corredor escala muy mal con miles de vértices (ahí es donde se colgaba
  // con GPX grandes); para un buffer de unos pocos cientos de metros de radio
  // no hace falta la resolución completa del track, con un punto cada
  // ~40 m sobra. Esto NO toca `sub` (resolución completa, usada para el km
  // y para exportar), solo la línea que se buffea.
  const MAX_BUFFER_VERTICES = 600;
  function decimateForBuffer(points) {
    if (points.length <= MAX_BUFFER_VERTICES) return points;
    const step = Math.ceil(points.length / MAX_BUFFER_VERTICES);
    const out = [];
    for (let i = 0; i < points.length; i += step) out.push(points[i]);
    if (out[out.length - 1] !== points[points.length - 1]) out.push(points[points.length - 1]);
    return out;
  }

  function computeBufferPreview() {
    if (bufferLayer) { map.removeLayer(bufferLayer); bufferLayer = null; }
    if (idxA === null || idxB === null || !trackPoints.length) { currentBuffer = null; return; }

    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    const sub = trackPoints.slice(lo, hi + 1);
    if (sub.length < 2) { currentBuffer = null; return; }

    const bufferInput = decimateForBuffer(sub);
    const line = turf.lineString(bufferInput.map(p => [p.lon, p.lat]));
    const radiusM = parseInt(radiusSlider.value, 10);
    let buffered = turf.buffer(line, radiusM / 1000, { units: 'kilometers', steps: 6 });
    buffered = turf.simplify(buffered, { tolerance: 0.0004, highQuality: false });

    if (buffered.geometry.type === 'MultiPolygon') {
      let best = null, bestArea = -1;
      buffered.geometry.coordinates.forEach(coords => {
        const poly = turf.polygon(coords);
        const a = turf.area(poly);
        if (a > bestArea) { bestArea = a; best = poly; }
      });
      buffered = best;
    }

    bufferLayer = L.geoJSON(buffered, {
      style: { color: '#d98a4f', weight: 1, fillColor: '#d98a4f', fillOpacity: 0.12 }
    }).addTo(map);

    currentBuffer = { buffered, sub };
  }

  // --- Buscar refugios vía Overpass ---
  function polyToOverpassString(polygonFeature) {
    const ring = polygonFeature.geometry.coordinates[0];
    return ring.map(c => c[1].toFixed(6) + ' ' + c[0].toFixed(6)).join(' ');
  }

  function buildOverpassQuery(polyStr) {
    const clauses = [];
    if (catShelter.checked) {
      clauses.push(`node["amenity"="shelter"](poly:"${polyStr}");`);
      clauses.push(`way["amenity"="shelter"](poly:"${polyStr}");`);
      clauses.push(`node["tourism"="wilderness_hut"](poly:"${polyStr}");`);
      clauses.push(`node["tourism"="alpine_hut"](poly:"${polyStr}");`);
    }
    if (catWater.checked) {
      clauses.push(`node["amenity"="drinking_water"](poly:"${polyStr}");`);
      clauses.push(`node["man_made"="water_tap"](poly:"${polyStr}");`);
      clauses.push(`node["amenity"="water_point"](poly:"${polyStr}");`);
    }
    if (catShop.checked) {
      clauses.push(`node["shop"="supermarket"](poly:"${polyStr}");`);
      clauses.push(`way["shop"="supermarket"](poly:"${polyStr}");`);
      clauses.push(`node["shop"="convenience"](poly:"${polyStr}");`);
    }
    return `[out:json][timeout:25];(${clauses.join('\n')});out center;`;
  }

  async function searchShelters() {
    if (idxA === null || idxB === null) return;
    if (!anyCategorySelected()) {
      setStatus('Selecciona al menos una categoría.', true);
      return;
    }
    computeBufferPreview();
    if (!currentBuffer) {
      setStatus('El tramo seleccionado es demasiado corto.', true);
      return;
    }
    searchBtn.disabled = true;
    searchBtn.textContent = 'Buscando…';
    searchProgress.hidden = false;
    resultsCountLabel.hidden = false;
    resultsCountLabel.className = 'rb-results';
    resultsCountLabel.textContent = 'Generando corredor de búsqueda…';
    resultsLayer.clearLayers();

    lastSub = currentBuffer.sub;
    const polyStr = polyToOverpassString(currentBuffer.buffered);
    const query = buildOverpassQuery(polyStr);

    const mirrors = [
      'https://overpass-api.de/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.openstreetmap.ru/api/interpreter'
    ];
    let lastErr = null;
    for (let i = 0; i < mirrors.length; i++) {
      try {
        resultsCountLabel.textContent = 'Consultando Overpass' + (i > 0 ? ' (mirror ' + (i+1) + ')' : '') + '…';
        const resp = await fetch(mirrors[i], { method: 'POST', body: 'data=' + encodeURIComponent(query) });
        if (!resp.ok) throw new Error('respondió ' + resp.status);
        const data = await resp.json();
        renderResults(data.elements || []);
        lastErr = null;
        break;
      } catch (err) {
        lastErr = err;
      }
    }
    if (lastErr) {
      resultsCountLabel.hidden = false;
      resultsCountLabel.className = 'rb-results err';
      resultsCountLabel.textContent = 'Error consultando Overpass tras probar ' + mirrors.length + ' mirrors: ' + lastErr.message;
      showToast('Error consultando Overpass: ' + lastErr.message);
    }
    searchProgress.hidden = true;
    searchBtn.textContent = 'Buscar';
    searchBtn.disabled = false;
    refreshSearchAvailability();
  }

  function renderResults(elements) {
    lastResults = [];
    const counts = { shelter: 0, water: 0, shop: 0 };
    elements.forEach(el2 => {
      const lat = el2.lat !== undefined ? el2.lat : (el2.center ? el2.center.lat : null);
      const lon = el2.lon !== undefined ? el2.lon : (el2.center ? el2.center.lon : null);
      if (lat === null || lon === null) return;
      const tags = el2.tags || {};
      const type = classifyTags(tags);
      if (!type) return;
      const name = tags.name || (CAT_META[type].label + ' sin nombre');
      const marker = L.marker([lat, lon], { icon: makeDivIcon(type) })
        .bindPopup('<b>' + name + '</b><br>' + CAT_META[type].label);
      resultsLayer.addLayer(marker);
      lastResults.push({ lat, lon, name, type });
      counts[type]++;
    });
    setStatus(lastResults.length + ' resultado(s) encontrado(s) en el corredor.');
    updateResultsUI(counts);
  }

  searchBtn.addEventListener('click', searchShelters);

  // --- Exportar a GPX ---
  function escapeXml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildGPX(mode) {
    const parts = [];
    parts.push('<?xml version="1.0" encoding="UTF-8"?>');
    parts.push('<gpx version="1.1" creator="EnRuta" xmlns="http://www.topografix.com/GPX/1/1">');
    lastResults.forEach(r => {
      parts.push('  <wpt lat="' + r.lat.toFixed(6) + '" lon="' + r.lon.toFixed(6) + '">');
      parts.push('    <name>' + escapeXml(r.name) + '</name>');
      parts.push('    <type>' + escapeXml(CAT_META[r.type] ? CAT_META[r.type].label : '') + '</type>');
      parts.push('  </wpt>');
    });
    if (mode === 'both' && lastSub.length > 1) {
      parts.push('  <trk><name>EnRuta - tramo</name><trkseg>');
      lastSub.forEach(p => parts.push('    <trkpt lat="' + p.lat.toFixed(6) + '" lon="' + p.lon.toFixed(6) + '"></trkpt>'));
      parts.push('  </trkseg></trk>');
    }
    parts.push('</gpx>');
    return parts.join('\n');
  }

  function downloadGPX(mode) {
    if (!lastResults.length) return;
    const gpxText = buildGPX(mode);
    const blob = new Blob([gpxText], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'enruta-shelters' + (mode === 'waypoints' ? '-waypoints' : '') + '.gpx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  exportBoth.addEventListener('click', () => downloadGPX('both'));
  exportWaypoints.addEventListener('click', () => downloadGPX('waypoints'));

  // --- Guardar / cargar rutas en IndexedDB ---
  const DB_NAME = 'enruta-db';
  const STORE = 'routes';
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbSaveRoute(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).add(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbGetAllRoutes() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbGetRoute(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbDeleteRoute(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function refreshSavedRoutes() {
    try {
      const routes = await dbGetAllRoutes();
      renderSavedRoutesList(routes);
    } catch (err) {
      savedRoutesList.textContent = 'No se pudo leer el almacenamiento local.';
    }
  }

  function renderSavedRoutesList(routes) {
    savedRoutesList.innerHTML = '';
    if (!routes.length) {
      const p = document.createElement('div');
      p.className = 'pill';
      p.textContent = 'Aún no hay rutas guardadas';
      savedRoutesList.appendChild(p);
      return;
    }
    routes.sort((a, b) => b.savedAt - a.savedAt).forEach(r => {
      const row = document.createElement('div');
      row.className = 'saved-route-row';

      const info = document.createElement('div');
      info.className = 'saved-route-info';
      const totalKm = r.trackPoints.length ? r.trackPoints[r.trackPoints.length - 1].dist.toFixed(1) : '0';
      const nameEl = document.createElement('b');
      nameEl.textContent = r.name;
      const metaEl = document.createElement('div');
      metaEl.className = 'dim';
      metaEl.textContent = totalKm + ' km · ' + (r.results ? r.results.length : 0) + ' refugios';
      info.appendChild(nameEl); info.appendChild(metaEl);

      const actions = document.createElement('div');
      actions.className = 'saved-route-actions';
      const loadBtn = document.createElement('button');
      loadBtn.className = 'secondary btn-sm'; loadBtn.textContent = 'Cargar';
      loadBtn.addEventListener('click', () => loadSavedRoute(r.id));
      const delBtn = document.createElement('button');
      delBtn.className = 'secondary btn-sm'; delBtn.textContent = '✕';
      delBtn.addEventListener('click', async () => { await dbDeleteRoute(r.id); refreshSavedRoutes(); });

      actions.appendChild(loadBtn); actions.appendChild(delBtn);
      row.appendChild(info); row.appendChild(actions);
      savedRoutesList.appendChild(row);
    });
  }

  async function loadSavedRoute(id) {
    try {
      const r = await dbGetRoute(id);
      if (!r) { setStatus('No se ha encontrado esa ruta guardada.', true); return; }
      loadRoute(r.trackPoints, { idxA: r.idxA, idxB: r.idxB, radius: r.radius, results: r.results });
      setStatus('Ruta "' + r.name + '" cargada.');
    } catch (err) {
      setStatus('Error al cargar la ruta guardada: ' + err.message, true);
    }
  }

  saveRouteBtn.addEventListener('click', async () => {
    if (!trackPoints.length) return;
    const name = saveNameInput.value.trim() || ('Ruta ' + new Date().toLocaleDateString());
    const record = {
      name,
      savedAt: Date.now(),
      trackPoints,
      idxA, idxB,
      radius: parseInt(radiusSlider.value, 10),
      results: lastResults
    };
    try {
      await dbSaveRoute(record);
      saveNameInput.value = '';
      setStatus('Ruta guardada.');
      refreshSavedRoutes();
    } catch (err) {
      setStatus('Error al guardar: ' + err.message, true);
    }
  });

  refreshSavedRoutes();

  // --- GPS: seguir posición en directo ---
  let watchId = null;
  let following = false;
  let hasCenteredOnce = false;
  let userMarker = null, userAccuracyCircle = null;

  gpsBtn.addEventListener('click', () => { following ? stopFollow() : startFollow(); });

  function startFollow() {
    if (!navigator.geolocation) { showToast('Este navegador no soporta geolocalización.'); return; }
    following = true;
    hasCenteredOnce = false;
    gpsBtn.classList.add('active');
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true, maximumAge: 2000, timeout: 15000
    });
  }
  function stopFollow() {
    following = false;
    gpsBtn.classList.remove('active');
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  }
  function onPosition(pos) {
    const { latitude, longitude, accuracy } = pos.coords;
    if (!userMarker) {
      userMarker = L.circleMarker([latitude, longitude], {
        radius: 8, color: '#4a90d9', weight: 2, fillColor: '#4a90d9', fillOpacity: 0.9
      }).addTo(map);
      userAccuracyCircle = L.circle([latitude, longitude], {
        radius: accuracy, color: '#4a90d9', weight: 1, fillColor: '#4a90d9', fillOpacity: 0.12
      }).addTo(map);
    } else {
      userMarker.setLatLng([latitude, longitude]);
      userAccuracyCircle.setLatLng([latitude, longitude]);
      userAccuracyCircle.setRadius(accuracy);
    }
    if (following) {
      if (!hasCenteredOnce) { map.setView([latitude, longitude], 16); hasCenteredOnce = true; }
      else map.panTo([latitude, longitude]);
    }
  }
  function onPositionError(err) {
    showToast('Error de geolocalización: ' + err.message);
    stopFollow();
  }
})();
</script>
</body>
</html>
